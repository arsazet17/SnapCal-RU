name: Upload existing SnapCal RU v1.0 files

on:
  push:
    branches: [delivery/v1.0]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Get the prepared release files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify the original APK without rebuilding
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Attach the existing files to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload v1.0 \
            release-assets/SnapCal-RU-v1.0.apk \
            release-assets/SnapCal-RU-v1.0-source.zip \
            release-assets/BUILD-REPORT-RU.md \
            release-assets/SHA256SUMS.txt \
            --clobber
